name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        working-directory: tool-panel
        run: node build.mjs
      - name: Create release
        run: |
          gh release create "$TAG" tool-panel/dist/tool-panel.js \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
